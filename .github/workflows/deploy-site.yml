# The website (site/) deploys on every merge to main that touches it:
# https://testwise-site.aubrey-9f5.workers.dev
# It stays out of search engines until INDEXING is "on" in site/wrangler.jsonc.
name: Deploy website
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy-site
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: website
      url: https://testwise-site.aubrey-9f5.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node --test test/site.test.mjs
      - run: node site/build.mjs
      - name: Create the D1 database if missing
        run: node site/setup.mjs
      - name: Apply database migrations
        working-directory: site
        run: npx wrangler d1 migrations apply testwise-site --remote
      - working-directory: site
        run: npx wrangler deploy
