name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install sympy
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: npm test
      - name: Build the web app
        run: npm run build:app
      - name: Create the D1 database if missing
        run: node scripts/setup.mjs
      - run: npx wrangler d1 migrations apply testwise --remote
      - name: Load questions
        run: npm run seed && npx wrangler d1 execute testwise --remote --file seed/seed.sql
      - run: npx wrangler deploy
      - name: Give Socrates the Claude API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          else
            echo "No ANTHROPIC_API_KEY secret; Socrates will use written hints only."
          fi
