# The deploy steps shared by staging and production. Called by
# deploy-staging.yml and deploy-production.yml, never run on its own.
name: Deploy steps
on:
  workflow_call:
    inputs:
      target:
        description: staging or production
        type: string
        required: true
      ref:
        description: Branch, tag or commit to deploy
        type: string
        default: main
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    # A GitHub environment per target: its page lists every deploy, and
    # required reviewers can be added to production in the repo settings.
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'production' && 'https://testwise.aubrey-9f5.workers.dev' || 'https://testwise-staging.aubrey-9f5.workers.dev' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: ${{ inputs.target == 'production' && 'testwise' || 'testwise-staging' }}
      ENV_FLAG: ${{ inputs.target == 'production' && '--env=' || '--env=staging' }}
    steps:
      - name: Check the target
        run: |
          case "${{ inputs.target }}" in
            staging|production) ;;
            *) echo "Unknown target ${{ inputs.target }}"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install sympy
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: npm test
      - name: Build the web app
        run: npm run build:app
      - name: Create the D1 database if missing
        run: node scripts/setup.mjs ${{ inputs.target }}
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply "$DB_NAME" --remote $ENV_FLAG
      - name: Load questions
        run: npm run seed && npx wrangler d1 execute "$DB_NAME" --remote $ENV_FLAG --file seed/seed.sql
      - run: npx wrangler deploy $ENV_FLAG
      - name: Give Socrates the Claude API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY || secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY $ENV_FLAG
          else
            echo "No CLAUDE_API_KEY secret; Socrates will use written hints only."
          fi
